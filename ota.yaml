version: 1
metadata:
  ota:
    minimum_version: "1.6.18"
# Pressure-test note (local branch):
# - Remove the server/backend pressure lane before an upstream PR unless we intentionally want the
#   contract to claim mixed-stack client + Java server build truth rather than the narrower
#   app/client slice.
project:
  name: appsmith
  description: Appsmith readiness slice covering app/client verification plus a provisional Java server build lane
execution:
  default_context: host
  contexts:
    host:
      backend: native
    app:
      backend: container
      lifecycle: ephemeral
      container:
        image: node:24-bookworm
        engines:
          - docker
          - podman
      attachments:
        isolated_paths:
          - app/client/node_modules
toolchains:
  node:
    provider: corepack
    version: '^24.14.1'
    package_managers:
      yarn: '3.5.1'
  java:
    provider: sdkman
    version: '25'
tools:
  maven: '>=3.9'
env:
  sources:
  - kind: dotenv
    path: .env
checks:
- name: env-template-present
  kind: file
  severity: info
  path: .env.example
  expect: file
tasks:
  setup:
    context: host
    category: setup
    description: Install repo dependencies.
    run: cd app/client && corepack yarn set version 3.5.1 && corepack yarn install
    execution:
      default_mode: native
      modes:
        native:
          context: host
          run: cd app/client && corepack yarn set version 3.5.1 && corepack yarn install
        container:
          context: app
          run: cd app/client && corepack yarn set version 3.5.1 && corepack yarn install
    effects:
      network: true
      network_kind: dependency_hydration
    notes: Materialize the repo-pinned Yarn release, then install dependencies from the app/client workspace.
    internal: true
  setup:env:
    context: host
    category: setup
    description: Create `.env` from `.env.example` when it is missing.
    action:
      kind: copy_if_missing
      from: .env.example
      to: .env
    notes: Create the root environment file only when missing.
    internal: true
    effects:
      writes:
        - .env
  server:build:
    context: host
    category: build
    description: Build the Appsmith Java server distribution without tests.
    run: cd app/server && ./build.sh -DskipTests
    execution:
      default_mode: native
      modes:
        native:
          context: host
          run: cd app/server && ./build.sh -DskipTests
    requirements:
      toolchains:
        - java
      tools:
        maven: '>=3.9'
    notes: |
      Build the Java server distribution using the repo-documented backend path.
      This is a provisional mixed-stack pressure lane and should stay local-only unless we
      intentionally want the upstream contract to claim backend build truth in addition to the
      app/client slice.
  test:
    context: host
    category: test
    description: Run Appsmith client unit tests.
    run: cd app/client && corepack yarn test:unit
    execution:
      default_mode: native
      modes:
        native:
          context: host
          run: cd app/client && corepack yarn test:unit
        container:
          context: app
          run: cd app/client && corepack yarn test:unit
    depends_on:
      - setup
    safe_for_agent: true
    notes: |
      Run the app/client unit test surface.
      This is a real supported lane, but the Jest workload here is not a tiny smoke check and can
      take noticeably longer than a quick local verification pass.
  lint:
    context: host
    category: test
    description: Run Appsmith client lint checks.
    run: cd app/client && corepack yarn lint
    execution:
      default_mode: native
      modes:
        native:
          context: host
          run: cd app/client && corepack yarn lint
        container:
          context: app
          run: cd app/client && corepack yarn lint
    depends_on:
      - setup
    safe_for_agent: true
    notes: |
      Run the app/client lint surface.
      This is the truthful repo lint lane for the slice, and upstream warnings currently fail the
      task rather than behaving like a lightweight advisory pass.
  verify:
    context: host
    category: test
    description: Aggregate lint and unit tests.
    run: "true"
    execution:
      default_mode: native
      modes:
        native:
          context: host
          run: "true"
        container:
          context: app
          run: "true"
    depends_on:
      - lint
      - test
    safe_for_agent: true
    notes: |
      Contract-level verification path for app/client.
      Because this path depends on both lint and unit tests, it should be treated as the real
      app/client verification lane rather than a guaranteed quick local loop.
workflows:
  default: verify
  verify:
    description: Canonical Appsmith app/client verification path for this contract slice.
    prepare:
      action:
        kind: copy_if_missing
        from: .env.example
        to: .env
    run:
      task: verify
    notes: |
      Use `ota up --workflow verify` to materialize `.env` and execute the declared verification path.
      Treat this as the truthful app/client verification lane for this slice, not as a local-fast
      smoke path.
agent:
  posture: readiness_strict
  entrypoint: setup
  default_task: verify
  safe_tasks:
  - lint
  - test
  - verify
  verify_after_changes:
  - verify
  writable_paths:
  - app
  - scripts
  protected_paths:
  - .github/workflows
  - .env
  - app/client/yarn.lock
  - ota.yaml
  inferred_boundary:
    reviewed: true
    provenance:
      writable_paths:
      - init:common_source_roots
      - init:stack_source_scan
      protected_paths:
      - init:contract_file_default
  bootstrap:
    ota:
      note: Only install ota if it is missing and installation is approved.
      sh: curl -fsSL https://dist.ota.run/install.sh | OTA_VERSION=v1.6.21 sh
      powershell: $env:OTA_VERSION='v1.6.21'; irm https://dist.ota.run/install.ps1 | iex
  notes: |
    Use `ota workflows` to inspect declared workflow paths.
    Use `ota up --workflow verify` when you want setup and verification through one declared path.
    Use `ota tasks --safe --use` to inspect the approved agent task surface before execution.
    Use `ota validate` before changes and `ota doctor` after edits.
    Use `ota run verify` for the contract verification path.
    Expect `lint`, `test`, and `verify` to reflect the real repo lanes, which can be heavier than
    a short local smoke check.
