version: 1
metadata:
  ota:
    minimum_version: "1.6.21"
project:
  name: appsmith
  description: Helm pressure slice covering chart dependency hydration and release rendering for deploy/helm
execution:
  default_context: host
  contexts:
    host:
      backend: native
tools:
  helm: "*"
  kubectl: "*"
tasks:
  helm:deps:
    context: host
    category: setup
    description: Resolve the Appsmith Helm chart dependencies.
    prepare:
      kind: dependency_hydration
      medium: package_dependencies
      source:
        kind: helm
        cwd: deploy/helm
    requirements:
      tools:
        helm: "*"
    effects:
      writes:
        - deploy/helm/charts
      network: true
      network_kind: dependency_hydration
    notes: Resolve subchart dependencies declared by deploy/helm/Chart.yaml.
  helm:render:
    context: host
    category: build
    description: Render the Appsmith Helm chart without mutating the cluster.
    command:
      exe: helm
      args:
        - template
        - appsmith
        - deploy/helm
        - --namespace
        - appsmith
    depends_on:
      - helm:deps
    requirements:
      tools:
        helm: "*"
    notes: Render the chart as a finite dry lane before cluster mutation.
  helm:install:
    context: host
    category: deploy
    description: Install the Appsmith Helm chart into Kubernetes.
    command:
      exe: helm
      args:
        - install
        - appsmith
        - deploy/helm
        - --namespace
        - appsmith
        - --create-namespace
    depends_on:
      - helm:deps
    requirements:
      tools:
        helm: "*"
        kubectl: "*"
    effects:
      external_state:
        - kubernetes
    notes: Mutates Kubernetes cluster state through the Helm release install path.
  helm:verify:
    description: Aggregate the finite Helm preparation and render path.
    aggregate:
      tasks:
        - helm:deps
        - helm:render
agent:
  posture: readiness_strict
  entrypoint: helm:render
  default_task: helm:verify
  verify_after_changes:
    - helm:verify
  writable_paths:
    - deploy/helm/charts
  protected_paths:
    - ota.helm-pressure.yaml
  notes: |
    This pressure slice intentionally targets only the Helm chart under deploy/helm.
    It is local pressure truth, not an upstream-ready whole-repo contract.
